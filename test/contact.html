<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contact | Kinza Rehman</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
    <script src="JS/main.js" defer></script>
</head>
    <body>
        <header class="site-header">
            <a class="logo" href="index.html">KR<span>.</span></a>
            <a class="text-link" href="index.html">← Home</a>
        </header>
        <main class="page contact-layout">
            <div>
                <p class="eyebrow">Let's connect</p>
                <h1>Tell me what you're building.</h1>
                <p class="page-intro">Use this form for a website inquiry, collaboration, or professional opportunity. I'll reply by email.</p>
                <p><strong>Email:</strong> <a href="mailto:KinzaRehman38@gmail.com">KinzaRehman38@gmail.com</a></p></div>
                <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <label for="name">Name</label>
                    <input id="name" name="name" type="text" required>
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required>
                    <label for="reason">What can I help with?</label>
                    <select id="reason" name="reason" required>
                        <option value="">Choose one</option>
                        <option>Website project</option>
                        <option>Job opportunity</option>
                        <option>Collaboration</option>
                        <option>Other</option>
                    </select><label for="budget">Estimated budget (optional)</label>
                    <select id="budget" name="budget"><option value="">Select a range</option>
                        <option>$500–$1,000</option>
                        <option>$1,000–$2,500</option>
                        <option>$2,500+</option></select>
                    <label for="message">Tell me about your project</label>
                    <textarea id="message" name="message" rows="8" required></textarea>
                    <button class="button primary" type="submit">Send inquiry</button>
                    <p class="form-note">Replace YOUR_FORM_ID in this file with your free Formspree form ID before publishing.</p></form></main>
                    <footer>
                        <p>©<span id="year"></span> Kinza Rehman</p>
                    </footer>
                </body>
            </html>
